    <div class="col-md-8 col-xl-6 chat">

</div>

<!-- jQuery -->

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>

<script>

$(document).ready(function () {

    $("#messageArea").on("submit", function (event) {

        event.preventDefault();

        const date = new Date();

        const hour = date.getHours();
        const minute = date.getMinutes();

        const str_time =
            hour.toString().padStart(2, "0") +
            ":" +
            minute.toString().padStart(2, "0");

        const rawText = $("#text").val().trim();

        if (!rawText) {
            return;
        }


        // User message
        const userHtml =
            '<div class="d-flex justify-content-end mb-4">' +
                '<div class="msg_cotainer_send">' +
                    rawText +
                    '<span class="msg_time_send">' +
                        str_time +
                    '</span>' +
                '</div>' +

                '<div class="img_cont_msg">' +
                    '<img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" ' +
                    'class="rounded-circle user_img_msg" alt="User">' +
                '</div>' +
            '</div>';


        $("#text").val("");

        $("#messageFormeight").append(userHtml);


        // Send message to Flask
        $.ajax({

            data: {
                msg: rawText
            },

            type: "POST",

            url: "/get"

        }).done(function (data) {

            const botHtml =
                '<div class="d-flex justify-content-start mb-4">' +

                    '<div class="img_cont_msg">' +
                        '<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" ' +
                        'class="rounded-circle user_img_msg" alt="Bot">' +
                    '</div>' +

                    '<div class="msg_cotainer">' +
                        data +
                        '<span class="msg_time">' +
                            str_time +
                        '</span>' +
                    '</div>' +

                '</div>';


            $("#messageFormeight").append(botHtml);

            // Scroll to bottom
            $("#messageFormeight").scrollTop(
                $("#messageFormeight")[0].scrollHeight
            );

        }).fail(function (xhr) {

            console.error("Server error:", xhr.responseText);

            const errorHtml =
                '<div class="d-flex justify-content-start mb-4">' +
                    '<div class="msg_cotainer">' +
                        'Sorry, something went wrong while processing your question.' +
                    '</div>' +
                '</div>';

            $("#messageFormeight").append(errorHtml);

        });

    });

});

</script>

</body>
</html>
